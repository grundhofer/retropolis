name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

# pull_request_target runs with a write token. This workflow must never check out
# or execute code from the pull request head.
permissions:
  actions: write
  contents: write # needed to commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # only react to the signature comment, not to every comment on every issue
    if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/grundhofer/retropolis/blob/main/CLA.md
          # signatures live in this repo, so GITHUB_TOKEN suffices — no PAT needed.
          # the cla-signatures branch must ALREADY EXIST: the action does not
          # create it and fails the check with "Branch cla-signatures not found".
          # It must also never be branch-protected — every signature is a commit.
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: grundhofer,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: |
            Thanks for the pull request. Retropolis requires a signed [Contributor License Agreement](https://github.com/grundhofer/retropolis/blob/main/CLA.md) before any contribution can be merged — it keeps the project licensable from a single hand, and Section 7 guarantees your contribution stays free forever.
            Please read it, then post exactly this comment on this PR:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks!
