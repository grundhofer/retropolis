# Deploys are gated on the CLOUDFLARE_API_TOKEN secret (plus
# CLOUDFLARE_ACCOUNT_ID) — until those are configured, these jobs are skipped.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  preview:
    if: github.event_name == 'pull_request' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for the preview environment
        run: pnpm --filter @retropolis/web build
        env:
          CLOUDFLARE_ENV: preview
      - name: Upload preview version (alias pr-<number>)
        working-directory: apps/web
        run: pnpm exec wrangler versions upload --preview-alias pr-${{ github.event.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @retropolis/web build
      - name: Deploy to production
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
